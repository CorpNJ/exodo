{% extends "base.html" %}

{% block title %}Iniciar Sesión - SIVVE{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h4 class="text-center mb-4">Acceso Administrativo</h4>
            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/web/login">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <!-- name="correo" debe coincidir con la variable en FastAPI -->
                    <input type="text" name="correo" class="form-control" required placeholder="admin@sivve.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <!-- name="contrasena" debe coincidir con la variable en FastAPI -->
                    <input type="password" name="contrasena" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
